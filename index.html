<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="新能源30天">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>新能源30天 · 打卡</title>
<style>
  :root{
    --bg:#0b1220; --card:#151e30; --card2:#1b2740; --line:#26334d;
    --txt:#e8eef7; --sub:#9fb0c8; --dim:#6b7d99;
    --acc:#19c37d; --acc2:#0ea5e9; --warn:#f59e0b; --fire:#f97316;
    --radius:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f2f5fa;--card:#ffffff;--card2:#eef2f8;--line:#dde5f0;--txt:#1a2536;--sub:#51617a;--dim:#8494ad;}
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:var(--bg);color:var(--txt);font-size:16px;line-height:1.55;
    padding-top:calc(var(--safe-t) + 8px); padding-bottom:calc(var(--safe-b) + 76px);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;padding:0 14px}

  /* 顶部 */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 2px 12px}
  .top .t1{font-size:22px;font-weight:800;letter-spacing:.5px}
  .top .t1 .bolt{color:var(--acc)}
  .top .t2{font-size:12px;color:var(--sub);margin-top:2px}
  .ring{position:relative;width:56px;height:56px;flex:none}
  .ring .p{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(var(--acc) var(--deg,0deg), var(--line) 0deg);
    display:flex;align-items:center;justify-content:center}
  .ring .p::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
  .ring .v{position:relative;font-size:12px;font-weight:700;color:var(--sub)}

  .stats{display:flex;gap:8px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
  .stat .n{font-size:18px;font-weight:800}
  .stat .l{font-size:11px;color:var(--sub)}
  .stat.fire .n{color:var(--fire)}

  /* 周切换 */
  .weeks{display:flex;gap:6px;margin-bottom:10px}
  .wbtn{flex:1;min-width:0;padding:7px 2px;text-align:center;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--sub);font-size:10.5px;line-height:1.35;cursor:pointer;font-family:inherit;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .wbtn b{display:block;font-size:12px}
  .wbtn.on{background:var(--acc);border-color:var(--acc);color:#04120b}
  .wbtn.on b,.wbtn.on span{color:#04120b}

  /* 卡片 */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
  .dayhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .daynum{font-size:13px;font-weight:700;color:var(--acc2)}
  .daytitle{font-size:19px;font-weight:800}
  .daydate{margin-left:auto;font-size:12px;color:var(--dim)}
  .done-badge{display:none;font-size:12px;color:var(--acc);font-weight:700}
  .card.isdone .done-badge{display:inline}

  .task{display:flex;align-items:flex-start;gap:10px;padding:11px 10px;border:1px solid var(--line);
    border-radius:12px;background:var(--card2);margin-top:10px}
  .task .cb{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--dim);
    display:flex;align-items:center;justify-content:center;margin-top:1px;cursor:pointer;font-size:15px;color:transparent}
  .task.checked .cb{background:var(--acc);border-color:var(--acc);color:#04120b}
  .task.checked .tk-name{text-decoration:line-through;color:var(--dim)}
  .tk{flex:1;min-width:0}
  .tk-name{font-size:14.5px;font-weight:600;word-break:break-word}
  .tk-tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;margin-right:6px;vertical-align:1px;font-weight:700}
  .tag-video{background:rgba(25,195,125,.16);color:var(--acc)}
  .tag-doc{background:rgba(14,165,233,.16);color:var(--acc2)}
  .tag-search{background:rgba(245,158,11,.16);color:var(--warn)}
  .tag-practice{background:rgba(139,92,246,.16);color:#a78bfa}
  .tk-note{font-size:12px;color:var(--sub);margin-top:2px}
  .openbtn{flex:none;align-self:center;border:none;border-radius:10px;background:var(--acc);
    color:#04120b;font-size:13px;font-weight:800;padding:8px 12px;cursor:pointer;text-decoration:none}
  .openbtn.doc{background:var(--acc2);color:#fff}
  .openbtn.search{background:var(--warn);color:#241300}

  .sec{margin-top:16px}
  .sec h3{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .check li{list-style:none;font-size:14px;color:var(--txt);padding:6px 0 6px 4px;border-bottom:1px dashed var(--line)}
  .check li:last-child{border-bottom:none}
  .check li::before{content:"？";margin-right:8px;color:var(--acc2);font-weight:800}

  textarea{width:100%;min-height:74px;background:var(--card2);border:1px solid var(--line);border-radius:12px;
    color:var(--txt);padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical}
  textarea:focus{outline:none;border-color:var(--acc)}

  .bigbtn{display:block;width:100%;padding:15px;margin-top:16px;border:none;border-radius:14px;
    font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;background:var(--acc);color:#04120b}
  .bigbtn.done{background:var(--card2);color:var(--acc);border:1px solid var(--acc)}
  .subbtn{display:block;width:100%;padding:11px;margin-top:10px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);color:var(--sub);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}

  /* 底部导航 */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding-bottom:var(--safe-b)}
  nav .row{max-width:560px;margin:0 auto;display:flex}
  nav button{flex:1;background:none;border:none;color:var(--dim);font-size:11px;font-weight:600;
    padding:9px 0 7px;cursor:pointer;font-family:inherit}
  nav button .ic{display:block;font-size:20px;margin-bottom:1px}
  nav button.on{color:var(--acc)}

  /* 计划列表 */
  .plist .item{display:flex;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer}
  .plist .item:last-child{border-bottom:none}
  .plist .idx{flex:none;width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--sub)}
  .plist .item.isdone .idx{background:var(--acc);color:#04120b;border-color:var(--acc)}
  .plist .nm{flex:1;font-size:15px;font-weight:600}
  .plist .item.isdone .nm{color:var(--dim);text-decoration:line-through}
  .plist .dt{font-size:11px;color:var(--dim)}
  .plist .today-mark{font-size:10px;color:var(--acc2);font-weight:700;border:1px solid var(--acc2);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}

  /* 资料库 */
  .res{padding:13px 4px;border-bottom:1px solid var(--line)}
  .res:last-child{border-bottom:none}
  .res .r1{display:flex;align-items:flex-start;gap:10px}
  .res .nm{flex:1;font-size:15px;font-weight:700}
  .res .ds{font-size:12.5px;color:var(--sub);margin-top:3px;word-break:break-word}
  .res .rd{flex:none;border:1px solid var(--line);background:var(--card2);color:var(--dim);border-radius:9px;
    font-size:12px;font-weight:700;padding:6px 10px;cursor:pointer;font-family:inherit}
  .res.isread .rd{background:var(--acc2);border-color:var(--acc2);color:#fff}
  .res .lnk{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--acc);text-decoration:none;
    border:1px solid var(--line);border-radius:9px;padding:6px 11px;background:var(--card2)}
  .res .lnk.doc{color:var(--acc2)}

  /* 设置/帮助 */
  .help p{font-size:13.5px;color:var(--sub);margin:8px 0}
  .help b{color:var(--txt)}
  .help .step{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;font-size:13.5px}
  input[type=date]{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);
    padding:9px 12px;font-size:15px;font-family:inherit}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 96px);z-index:99;
    background:#1f2c46;color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:.96}
  #installTip{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 64px);z-index:40;
    background:linear-gradient(135deg,#0ea5e9,#19c37d);color:#fff;border-radius:14px;padding:11px 14px;
    font-size:13.5px;font-weight:600;line-height:1.45;box-shadow:0 6px 20px rgba(14,165,233,.4)}
  #installTip .x{position:absolute;right:8px;top:6px;border:none;background:none;color:#fff;opacity:.75;
    font-size:15px;padding:4px 6px;cursor:pointer;font-family:inherit}
  #installTip b{font-weight:800}
  .muted{font-size:12px;color:var(--dim)}
  .hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<nav><div class="row">
  <button data-tab="today"><span class="ic">⚡️</span>今日</button>
  <button data-tab="plan"><span class="ic">🗓</span>计划</button>
  <button data-tab="res"><span class="ic">📚</span>资料库</button>
  <button data-tab="set"><span class="ic">⚙️</span>设置</button>
</div></nav>

<script src="app.js"></script>
</body>
</html>
